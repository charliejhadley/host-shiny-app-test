<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; }
  p { position: absolute; margin: 1em; }
  iframe { border: 0; width: 100%; height: 100%; visibility: hidden; }
</style>
</head>
<body>
<p id="msg">Connecting to shinyapps...</p>
<iframe id="app"></iframe>
<script>
  const url = "https://charlie-visibledata.shinyapps.io/loading-app-3/";
  const app = document.getElementById("app");
  addEventListener("message", e => {
    if (e.origin === new URL(url).origin && e.data?.type === "shiny-app-ready") {
      document.getElementById("msg").remove();
      app.style.visibility = "visible";
    }
  });
  app.src = url;
</script>
</body>
</html>
